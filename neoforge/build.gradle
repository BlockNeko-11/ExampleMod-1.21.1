apply plugin: "com.github.johnrengelman.shadow"

architectury {
    platformSetupLoomIde()
    neoForge {
        platformPackage = "forge"
    }
}

def generatedResources = file("src/generated")

sourceSets {
    main {
        resources.srcDir generatedResources
    }
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    // forge {
    //     convertAccessWideners = true
    //     extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

    //     mixinConfig "example_mod.mixins.json"
    //     mixinConfig "example_mod-neoforge.mixins.json"
    // }

    neoForge {}

    runs {
        data {
            data()
            programArgs "--all", "--mod", "example_mod"
            programArgs "--output", generatedResources.absolutePath
//            property "forge.logging.markers", "SCAN,REGISTRIES,REGISTRYDUMP"
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    maven {
        url = "https://maven.neoforged.net/releases"
    }
}

dependencies {
    // forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    
    // Remove the next line if you don't want to depend on the API
    // modImplementation "dev.architectury:architectury-forge:${rootProject.architectury_version}"

    // Sunshine Core
    // modImplementation "com.github.BlockNeko-11.SunshineCore:sunshine-core-neoforge:${rootProject.minecraft_version}-${rootProject.sunshine_core_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
}

def props = [
    "id": rootProject.mod_id,
    "version": project.version,
    "name": rootProject.mod_name,
    "description": rootProject.mod_description,
    "license": rootProject.mod_license,
    "home_page": rootProject.mod_home_page,
    "sources_page": rootProject.mod_sources_page,
    "issues_page": rootProject.mod_issues_page,
    "minecraft_dependency": rootProject.fml_mcver_dependency,
    "neoforge_dependency": rootProject.neoforge_dependency
]

processResources {
    props.forEach { k, v ->
        inputs.property k, v
    }

    filesMatching("META-INF/neoforge.mods.toml") {
        expand props
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
